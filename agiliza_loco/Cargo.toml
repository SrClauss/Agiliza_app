[workspace]

[package]
name = "agiliza_loco"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "agiliza_loco-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["ws"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
rust_decimal = "1.36"
include_dir = { version = "0.7" }
reqwest = { version = "0.13.4", features = ["json"] }
jsonwebtoken = "11.0.0"
async-stripe = { version = "0.41.0", features = ["runtime-tokio-hyper-rustls", "webhook-events", "checkout"] }
lazy_static = "1.5"
futures-util = "0.3"
rand = "0.10.2"

[[bin]]
name = "agiliza_loco-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
