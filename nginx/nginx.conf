user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name agilizapro.net www.agilizapro.net app.agilizapro.net admin.agilizapro.net api.agilizapro.net storage.agilizapro.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 1. APP WEB PWA (https://app.agilizapro.net / https://agilizapro.net)
    server {
        listen 443 ssl http2;
        server_name agilizapro.net www.agilizapro.net app.agilizapro.net;

        ssl_certificate /etc/letsencrypt/live/agilizapro.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agilizapro.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://agiliza_web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 2. PAINEL ADMIN ISOLADO (https://admin.agilizapro.net)
    server {
        listen 443 ssl http2;
        server_name admin.agilizapro.net;

        ssl_certificate /etc/letsencrypt/live/agilizapro.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agilizapro.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://agiliza_admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 3. BACKEND RUST REST & WEBSOCKET (https://api.agilizapro.net)
    server {
        listen 443 ssl http2;
        server_name api.agilizapro.net;

        ssl_certificate /etc/letsencrypt/live/agilizapro.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agilizapro.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Suporte completo a WebSockets do Chat (/ws)
        location / {
            proxy_pass http://agiliza_loco:5150;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 4. STORAGE DE AVATARES MINIO (https://storage.agilizapro.net)
    server {
        listen 443 ssl http2;
        server_name storage.agilizapro.net;

        ssl_certificate /etc/letsencrypt/live/agilizapro.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agilizapro.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
