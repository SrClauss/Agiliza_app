services:
  # 1. PROXY REVERSO NGINX COM SSL (AGILIZAPRO.NET, APP, ADMIN, API, STORAGE)
  nginx:
    image: nginx:alpine
    container_name: agiliza_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - agiliza_web
      - agiliza_admin
      - agiliza_loco
      - minio

  # 2. AUTO SSL LET'S ENCRYPT (CERTBOT)
  certbot:
    image: certbot/certbot
    container_name: agiliza_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"

  # 3. BANCO DE DADOS POSTGRESQL 16 PROTEGIDO (ISOLADO NA REDE INTERNA DO SERVIDOR)
  postgresql:
    image: postgres:16-alpine
    container_name: agiliza_postgres
    restart: always
    environment:
      POSTGRES_USER: agiliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agiliza_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agiliza -d agiliza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. CACHE REDIS 7 PROTEGIDO (REDE INTERNA)
  redis:
    image: redis:7-alpine
    container_name: agiliza_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. OBJECT STORAGE MINIO (S3 COMPATIBLE)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: agiliza_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data

  # 6. BACKEND RUST (AGILIZA_LOCO - DEDICADO EM API.AGILIZAPRO.NET)
  agiliza_loco:
    build:
      context: ./agiliza_loco
      dockerfile: Dockerfile
    container_name: agiliza_backend
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: agilizapro-media
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-""}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-""}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-""}
      LOCO_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5150
    expose:
      - "5150"

  # 7. APP WEB NEXT.JS (AGILIZA_WEB)
  agiliza_web:
    build:
      context: ./agiliza_web
      dockerfile: Dockerfile
    container_name: agiliza_web
    restart: always
    depends_on:
      - agiliza_loco
    environment:
      NEXT_PUBLIC_API_URL: https://api.agilizapro.net
    expose:
      - "3000"

  # 8. PAINEL ADMIN ISOLADO (AGILIZA_ADMIN)
  agiliza_admin:
    build:
      context: ./agiliza_admin
      dockerfile: Dockerfile
    container_name: agiliza_admin
    restart: always
    expose:
      - "80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
